[tool.poetry]
name = "aegis"
version = "0.1.0"
description = "Aegis — The Semantic Spend Orchestrator: AI-powered expense management with GraphRAG + multi-agent orchestration"
authors = ["Aegis Team"]
readme = "README.md"
license = "Proprietary"
packages = [
    { include = "gateway" },
    { include = "agents" },
    { include = "knowledge_graph" },
    { include = "fraud_detection" },
    { include = "dashboard" },
]

[tool.poetry.dependencies]
python = "^3.11"

# Core Framework
langgraph = "^0.3"
langchain = "^0.3"
langchain-openai = "^0.3"
langchain-anthropic = "^0.3"
langchain-google-genai = "^2.0"
langsmith = "^0.2"

# API & Web
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
streamlit = "^1.40"
python-multipart = "^0.0.18"

# Graph Database
neo4j = "^5.26"

# Vector Store & Embeddings
chromadb = "^0.5"
sentence-transformers = "^3.3"

# ML & Fraud Detection
scikit-learn = "^1.6"
transformers = "^4.47"
torch = "^2.5"
Pillow = "^11.0"

# Data & Parsing
pydantic = "^2.10"
instructor = "^1.7"
rapidfuzz = "^3.10"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
alembic = "^1.14"
psycopg2-binary = "^2.9"

# Infrastructure
redis = "^5.2"
celery = "^5.4"
tenacity = "^9.0"
httpx = "^0.28"

# Logging
structlog = "^24.4"

# Integrations
slack-sdk = "^3.33"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.13"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============================================================
# Ruff Configuration
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.lint.isort]
known-first-party = ["gateway", "agents", "knowledge_graph", "fraud_detection", "dashboard"]

# ============================================================
# Pytest Configuration
# ============================================================
[tool.pytest.ini_options]
testpaths = ["gateway/tests", "agents/tests", "knowledge_graph/tests", "fraud_detection/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# ============================================================
# MyPy Configuration
# ============================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
